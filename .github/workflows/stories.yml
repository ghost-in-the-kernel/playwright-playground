# Generated by Suite Builder for https://playwright-playground.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitHub Actions: the stories job (G-208). When Jira calls it (a Jira Automation rule sends a repository_dispatch of type stories-ready), when started by hand,
# and hourly on weekdays: the stories in Jira's ready status become tests or come back pushed back, the
# cards are moved, and what changed is proposed as a pull request. Nothing to do: it stops in a minute.
# Secrets: JIRA_API_TOKEN, JIRA_EMAIL, ANTHROPIC_API_KEY (JIRA_EMAIL on Jira Cloud only). Not set up yet
# (jira-loop/jira.properties blank): it does nothing.
# The agents (G-216): each takes one story at a time, as its own branch and pull request, until none is
# left; a merge to main reports the story done and frees what it held. More agents: the agents list below.
# The pull requests need Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Stories from Jira
on:
  repository_dispatch:
    types: [stories-ready]
  workflow_dispatch:
  push:
    branches: [main]
  # ==== YOURS (schedule): safe to edit; regenerating keeps what is between these lines ====
  schedule:
    - cron: '7 * * * 1-5'
  # ==== END YOURS (schedule) ====
concurrency:
  group: stories-${{ github.event_name }}
permissions:
  contents: write
  pull-requests: write
jobs:
  agents:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
# ==== YOURS (agents): safe to edit; regenerating keeps what is between these lines ====
        agent: [1, 2, 3]
# ==== END YOURS (agents) ====
    env:
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      SUITE_AGENT: agent-${{ matrix.agent }}
      SUITE_CREW: 'npx --yes @anthropic-ai/claude-code -p "/stories {key}" --permission-mode acceptEdits --allowedTools "Read,Glob,Grep,Edit,Write,Bash(mvn -o:*),Bash(node jira-loop/agents.mjs need:*)"'
      SUITE_CHECKS: |
        mvn -B -q -o test-compile
        mvn -B -o test -Dtest=SuiteRulesTest
      SUITE_PROPOSE: gh pr create --head "{branch}" --title "{key}: {title}" --body "Tests for {key}, written by the suite's crew. Merging it moves the card to done."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: git config user.name "Suite stories" && git config user.email "suite-stories@users.noreply.github.com"
      - run: mvn -B -q test -Dtest=SuiteRulesTest
      - run: node jira-loop/agents.mjs work
  merged:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node jira-loop/agents.mjs merged
