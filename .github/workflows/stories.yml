# Generated by Suite Builder for https://playwright-playground.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitHub Actions: the stories job (G-208). When Jira calls it (a Jira Automation rule sends a repository_dispatch of type stories-ready), when started by hand,
# and hourly on weekdays: the stories in Jira's ready status become tests or come back pushed back, the
# cards are moved, and what changed is proposed as a pull request. Nothing to do: it stops in a minute.
# Secrets: JIRA_API_TOKEN, JIRA_EMAIL, ANTHROPIC_API_KEY (JIRA_EMAIL on Jira Cloud only). Not set up yet
# (jira/jira.properties blank): it does nothing.
# The pull request needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Stories from Jira
on:
  repository_dispatch:
    types: [stories-ready]
  workflow_dispatch:
  # ==== YOURS (schedule): safe to edit; regenerating keeps what is between these lines ====
  schedule:
    - cron: '7 * * * 1-5'
  # ==== END YOURS (schedule) ====
concurrency:
  group: stories
permissions:
  contents: write
  pull-requests: write
jobs:
  stories:
    runs-on: ubuntu-latest
    env:
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bash jira/stories.sh
      - name: Propose what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing to propose."; exit 0; fi
          git config user.name "Suite stories"
          git config user.email "suite-stories@users.noreply.github.com"
          git switch -c "stories/run-${{ github.run_id }}"
          git add -A
          git commit -q -m "Stories from Jira: tests written and stories pushed back"
          git push -q origin HEAD
          gh pr create --fill --title "Stories from Jira (run ${{ github.run_id }})"
