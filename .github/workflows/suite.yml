# Generated by Suite Builder for https://playwright-playground.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitHub Actions: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. Each night, and when
# started by hand, every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
name: Suite
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
env:
  # ==== YOURS (env): safe to edit; regenerating keeps what is between these lines ====
  # Another copy of the site: a repository variable BASE_URL (Settings > Variables); unset, the crawled site.
  BASE_URL: ${{ vars.BASE_URL }}
  # ==== END YOURS (env) ====
jobs:
  quick:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps chromium"
      - run: mvn -B test -Dgroups=http,smoke -Dbrowser=chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick
          if-no-files-found: ignore
          path: |
            target/surefire-reports/TEST-*.xml
            target/report.html
            target/failures/
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps chromium firefox"
      - run: mvn -B test -Dbrowser=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            target/surefire-reports/TEST-*.xml
            target/report.html
            target/failures/
  # ==== YOURS (jobs): safe to edit; regenerating keeps what is between these lines ====
  # ==== END YOURS (jobs) ====
