# Generated by Suite Builder for https://playwright-playground.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitLab CI: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. Each night, and when
# started by hand, every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
# Nightly: a pipeline schedule (Build > Pipeline schedules) of '23 3 * * *', UTC. BASE_URL: a CI/CD variable.
# Playwright's own image, of the version this suite uses: Java, Maven and its browsers, ready.
default:
  image:
    name: mcr.microsoft.com/playwright/java:v1.56.0-noble
    entrypoint: ['']
quick:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - mvn -B test -Dgroups=http,smoke -Dbrowser=chromium
  artifacts:
    name: quick
    when: always
    expire_in: 2 weeks
    paths:
      - target/report.html
      - target/failures/
    reports:
      junit: target/surefire-reports/TEST-*.xml
full:
  rules:
    - if: $SUITE_JOB == "stories"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  parallel:
    matrix:
      - BROWSER: chromium
      - BROWSER: firefox
  script:
    - mvn -B test -Dbrowser=$BROWSER
  artifacts:
    name: full-$BROWSER
    when: always
    expire_in: 2 weeks
    paths:
      - target/report.html
      - target/failures/
    reports:
      junit: target/surefire-reports/TEST-*.xml
# The stories job (G-208): a pipeline trigger (Jira Automation) or a schedule with SUITE_JOB=stories.
# CI/CD variables: JIRA_API_TOKEN, JIRA_EMAIL, ANTHROPIC_API_KEY, and SUITE_PUSH_TOKEN (a project access token that may push).
stories:
  rules:
    - if: $SUITE_JOB == "stories"
  image: node:20
  script:
    - apt-get update -qq
    - apt-get install -y -qq openjdk-17-jdk-headless maven > /dev/null
    - bash jira-loop/stories.sh
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing to propose."; exit 0; fi
    - git config user.name "Suite stories"
    - git config user.email "suite-stories@users.noreply.github.com"
    - git switch -c "stories/run-$CI_PIPELINE_ID"
    - git add -A
    - git commit -q -m "Stories from Jira: tests written and stories pushed back"
    - git push -o merge_request.create -o merge_request.target="$CI_DEFAULT_BRANCH" -o merge_request.title="Stories from Jira (pipeline $CI_PIPELINE_ID)" "https://oauth2:${SUITE_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/stories/run-$CI_PIPELINE_ID"
