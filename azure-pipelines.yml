# Generated by Suite Builder for https://playwright-playground.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# Azure Pipelines: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. Each night, and when
# started by hand, every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
# BASE_URL: a pipeline variable.
trigger:
  branches:
    include: ['*']
pr:
  branches:
    include: ['*']
schedules:
  - cron: '23 3 * * *'
    displayName: Nightly
    branches:
      include: [main]
    always: true
pool:
  vmImage: ubuntu-latest
jobs:
  - job: quick
    condition: and(ne(variables['Build.Reason'], 'Schedule'), ne(variables['Build.Reason'], 'Manual'))
    steps:
      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled
      - script: mvn -B -q exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps chromium"
      - script: mvn -B test -Dgroups=http,smoke -Dbrowser=chromium
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'target/surefire-reports/TEST-*.xml'
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: target/report.html
          artifact: report-quick
      - task: PublishPipelineArtifact@1
        condition: failed()
        inputs:
          targetPath: target/failures
          artifact: quick
  - job: full
    condition: in(variables['Build.Reason'], 'Schedule', 'Manual')
    strategy:
      matrix:
        chromium:
          BROWSER: chromium
        firefox:
          BROWSER: firefox
    steps:
      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled
      - script: mvn -B -q exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI "-Dexec.args=install --with-deps chromium firefox"
      - script: mvn -B test -Dbrowser=$(BROWSER)
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'target/surefire-reports/TEST-*.xml'
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: target/report.html
          artifact: report-full-$(BROWSER)
      - task: PublishPipelineArtifact@1
        condition: failed()
        inputs:
          targetPath: target/failures
          artifact: full-$(BROWSER)
  # ==== YOURS (jobs): safe to edit; regenerating keeps what is between these lines ====
  # ==== END YOURS (jobs) ====
