# Generated by Suite Builder for https://playwright-playground.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# Azure Pipelines: the stories job (G-208). When Jira calls it (a Jira Automation rule calls this pipeline's Runs API), when started by hand,
# and hourly on weekdays: the stories in Jira's ready status become tests or come back pushed back, the
# cards are moved, and what changed is proposed as a pull request. Nothing to do: it stops in a minute.
# Secrets: JIRA_API_TOKEN, JIRA_EMAIL, ANTHROPIC_API_KEY (JIRA_EMAIL on Jira Cloud only). Not set up yet
# (jira-loop/jira.properties blank): it does nothing.
# A pipeline of its own (Pipelines > New > existing YAML: azure-stories.yml). Its build service needs Contribute
# and Create branch on the repository, and Contribute to pull requests.
trigger: none
pr: none
# ==== YOURS (schedule): safe to edit; regenerating keeps what is between these lines ====
schedules:
  - cron: '7 * * * 1-5'
    displayName: Stories fallback
    branches:
      include: [main]
    always: true
# ==== END YOURS (schedule) ====
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    persistCredentials: true
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
  - script: bash jira-loop/stories.sh
    env:
      JIRA_API_TOKEN: $(JIRA_API_TOKEN)
      JIRA_EMAIL: $(JIRA_EMAIL)
      ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
  - script: |
      if [ -z "$(git status --porcelain)" ]; then echo "Nothing to propose."; exit 0; fi
      git config user.name "Suite stories"
      git config user.email "suite-stories@users.noreply.github.com"
      git switch -c "stories/run-$(Build.BuildId)"
      git add -A
      git commit -q -m "Stories from Jira: tests written and stories pushed back"
      git push -q origin HEAD
      az repos pr create --source-branch "stories/run-$(Build.BuildId)" --target-branch "$(Build.SourceBranchName)" --title "Stories from Jira (run $(Build.BuildId))" --org "$(System.CollectionUri)" --project "$(System.TeamProject)" --repository "$(Build.Repository.Name)"
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
